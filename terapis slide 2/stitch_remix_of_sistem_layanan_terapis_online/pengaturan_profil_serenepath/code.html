<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Profile Settings - SerenePath</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

            extend: {

                      "background": "#f9f9fb",
                      "on-surface": "#1a1c1d",
                      "on-secondary-fixed": "#291231",
                      "on-error-container": "#93000a",
                      "surface-container-highest": "#e2e2e4",

                      "on-tertiary": "#ffffff",
                      "inverse-surface": "#2f3132",
                      "surface-tint": "#6f43c0",
                      "primary-fixed-dim": "#d3bbff",
                      "error": "#ba1a1a",
                      "primary-container": "#673ab7",
                      "on-background": "#1a1c1d",
                      "on-secondary-fixed-variant": "#583d5f",
                      "surface-container": "#eeeef0",
                      "on-primary-fixed": "#250059",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-low": "#f3f3f5",
                      "tertiary-container": "#00615a",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed": "#8ef4e9",
                      "secondary-fixed-dim": "#debbe4",
                      "surface-variant": "#e2e2e4",
                      "secondary": "#715478",
                      "on-secondary-container": "#75597c",
                      "on-primary-fixed-variant": "#5727a6",
                      "on-tertiary-fixed-variant": "#00504a",
                      "on-tertiary-fixed": "#00201d",
                      "inverse-primary": "#d3bbff",
                      "on-tertiary-container": "#76ddd2",
                      "secondary-container": "#f8d4fe",
                      "tertiary-fixed-dim": "#71d7cd",
                      "outline": "#7b7484",
                      "surface-container-high": "#e8e8ea",
                      "primary": "#4f1c9e",
                      "secondary-fixed": "#fad7ff",
                      "outline-variant": "#ccc3d5",
                      "on-primary": "#ffffff",
                      "inverse-on-surface": "#f0f0f2",
                      "surface-bright": "#f9f9fb",
                      "surface": "#f9f9fb"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "8px",
                      "xl": "40px",
                      "unit": "4px",
                      "margin-desktop": "64px",
                      "lg": "24px",
                      "gutter": "24px",
                      "margin-mobile": "16px",
                      "xs": "4px",
                      "md": "16px"
              },
              "fontFamily": {
                      "headline-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "caption": ["Inter"],

                      "body-md": ["Inter"]

              "fontSize": {

          },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input {
            @apply w-full bg-[#F5F5F7] border-transparent rounded-lg px-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-colors outline-none;
        }
        .form-label {
            @apply block font-label-md text-on-surface-variant mb-xs;
        }
        .section-card {
            @apply bg-surface-container-lowest rounded-xl p-lg shadow-[0px_4px_20px_rgba(103,58,183,0.08)];
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Header (Suppressed main nav since this is a focused settings page) -->
<header class="bg-surface shadow-sm h-20 w-full flex items-center px-margin-mobile md:px-margin-desktop sticky top-0 z-50">
<div class="flex items-center gap-sm">
<a aria-label="Go back" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-sm rounded-full hover:bg-surface-container-low" href="#">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<span class="font-headline-lg-mobile md:font-headline-lg text-primary">Settings</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-xl">
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
<!-- Settings Navigation (Sidebar on Desktop) -->
<div class="hidden md:block col-span-3">
<nav class="sticky top-[120px] flex flex-col gap-sm">
<a class="flex items-center gap-md px-md py-sm bg-primary-container text-on-primary-container rounded-lg font-label-md font-bold transition-all" href="#personal-info">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
                        Personal Info
                    </a>
<a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-high rounded-lg font-label-md transition-all" href="#security">
<span class="material-symbols-outlined">lock</span>
                        Security
                    </a>
<a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-high rounded-lg font-label-md transition-all" href="#notifications">
<span class="material-symbols-outlined">notifications</span>
                        Notifications
                    </a>
<a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-high rounded-lg font-label-md transition-all" href="#health-interests">
<span class="material-symbols-outlined">favorite</span>
                        Health Interests
                    </a>
</nav>
</div>
<!-- Settings Forms -->
<div class="col-span-1 md:col-span-9 flex flex-col gap-xl">
<!-- Personal Information -->
<section class="section-card" id="personal-info">
<div class="mb-lg border-b border-outline-variant pb-sm">
<h2 class="font-title-md text-on-surface">Personal Information</h2>
<p class="font-caption text-on-surface-variant mt-xs">Update your basic profile details.</p>
</div>
<div class="flex flex-col md:flex-row gap-lg mb-lg">
<div class="flex-shrink-0 flex flex-col items-center">
<div class="w-24 h-24 rounded-full overflow-hidden mb-sm border-2 border-surface-variant relative group cursor-pointer">
<img alt="Profile Picture" class="w-full h-full object-cover" data-alt="A close-up, softly lit portrait of a calm individual in a modern, light-filled studio setting. The image should have a professional yet approachable and warm aesthetic, suitable for a mental health platform profile picture." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBa-h8xTHJSAQuU1572rYBDB90nZoErcuOMpkn2pfTetYE8ix7tLH3osaly279S3NdUYqglfe_vqr42z4tAiuuGMzTGTEPLcQuA_LpJoXxyXmx3GkftgO9G6DSfVMRJJlg3umkEdQiDf0EKGrZ4xd2P0WLYISvcmo-Yoa0wJAxY1nY2sCulbkcd_RmEHMLQHr8CRUIXIq89cpKtutVHYGJXg2M-EDuq5-VccsT74wThRNDahdFTN1odUA"/>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white">photo_camera</span>
</div>
</div>
<button class="font-label-md text-primary hover:text-primary-fixed transition-colors">Change Photo</button>
</div>
<div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="form-label" for="firstName">First Name</label>
<input class="form-input" id="firstName" type="text" value="Alex"/>
</div>
<div>
<label class="form-label" for="lastName">Last Name</label>
<input class="form-input" id="lastName" type="text" value="Morgan"/>
</div>
<div class="md:col-span-2">
<label class="form-label" for="email">Email Address</label>
<input class="form-input" id="email" type="email" value="alex.morgan@example.com"/>
</div>
<div class="md:col-span-2">
<label class="form-label" for="phone">Phone Number</label>
<input class="form-input" id="phone" type="tel" value="+1 (555) 123-4567"/>
</div>
</div>
</div>
<div class="flex justify-end gap-md mt-lg">
<button class="px-lg py-sm rounded-lg bg-surface-container-high text-on-surface-variant font-label-md hover:bg-surface-container-highest transition-colors">Cancel</button>
<button class="px-lg py-sm rounded-lg bg-primary text-on-primary font-label-md hover:opacity-90 transition-opacity">Save Changes</button>
</div>
</section>
<!-- Footer (simplified for settings page) -->
<footer class="mt-xl py-lg border-t border-outline-variant flex flex-col md:flex-row justify-between items-center gap-md">
<span class="font-caption text-on-surface-variant">© 2024 SerenePath Mental Health.</span>
<div class="flex gap-lg">
<a class="font-caption text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-caption text-on-surface-variant hover:text-primary transition-colors" href="#">Terms</a>
<a class="font-caption text-on-surface-variant hover:text-primary transition-colors" href="#">Support</a>
</div>
</footer>
</div>
</div>
</main>
</body></html>
